name: Release unsigned IPA

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve manual tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            git checkout --detach "refs/tags/${TAG}"
          else
            git tag "${TAG}" "${GITHUB_SHA}"
            git push origin "${TAG}"
          fi

      - name: Build unsigned IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          MARKETING_VERSION: ${{ steps.release.outputs.version }}
          IPA_NAME: AnimeCloud-${{ steps.release.outputs.tag }}-unsigned.ipa
        run: Scripts/build-unsigned-ipa.sh

      - name: Generate SHA-256 checksum
        env:
          IPA_PATH: Build/Unsigned/AnimeCloud-${{ steps.release.outputs.tag }}-unsigned.ipa
        run: |
          ipa_directory="$(dirname "${IPA_PATH}")"
          ipa_name="$(basename "${IPA_PATH}")"
          (cd "${ipa_directory}" && shasum -a 256 "${ipa_name}" > "${ipa_name}.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          IPA_PATH: Build/Unsigned/AnimeCloud-${{ steps.release.outputs.tag }}-unsigned.ipa
          RELEASE_NOTES: |
            Download the unsigned IPA below for use with LiveContainer or another compatible sideloading tool. The archive is intentionally unsigned and must be signed by the installation tool for the target device.

            Use the accompanying `.sha256` file to verify the download with `shasum -a 256 -c <filename>.sha256`.
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${IPA_PATH}" "${IPA_PATH}.sha256" --clobber
          else
            gh release create "${TAG}" "${IPA_PATH}" "${IPA_PATH}.sha256" \
              --verify-tag \
              --generate-notes \
              --notes "${RELEASE_NOTES}" \
              --title "AnimeCloud ${TAG}"
          fi

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          IPA_NAME: AnimeCloud-${{ steps.release.outputs.tag }}-unsigned.ipa
        run: |
          asset_names="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
          grep -Fxq "${IPA_NAME}" <<< "${asset_names}"
          grep -Fxq "${IPA_NAME}.sha256" <<< "${asset_names}"
