name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show build environment
        run: xcodebuild -version

      - name: Build and run unit tests
        run: |
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid // empty')"
          if [[ -z "${simulator_id}" ]]; then
            echo "No available iPhone simulator was found on the runner" >&2
            exit 1
          fi

          xcodebuild \
            -project AnimeCloud.xcodeproj \
            -scheme AnimeCloud \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            -derivedDataPath Build/DerivedData-CI \
            CODE_SIGNING_ALLOWED=NO \
            clean test

      - name: Build unsigned IPA
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: Scripts/build-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: AnimeCloud-unsigned-${{ github.sha }}
          path: Build/Unsigned/AnimeCloud-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
