name: Main CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show build environment
        run: xcodebuild -version

      - name: Test LiveContainer source generation
        run: python3 Scripts/test-generate-source.py

      - name: Build and run unit tests
        run: |
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].udid // empty')"
          if [[ -z "${simulator_id}" ]]; then
            echo "No available iPhone simulator was found on the runner" >&2
            exit 1
          fi

          xcodebuild \
            -project AnimeCloud.xcodeproj \
            -scheme AnimeCloud \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${simulator_id}" \
            -derivedDataPath Build/DerivedData-CI \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            clean test
