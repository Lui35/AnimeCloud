name: AnimeCloud
options:
  bundleIdPrefix: com.animecloud
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    OTHER_LDFLAGS:
      - "-ObjC"
      - "-lc++"
packages:
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    exactVersion: 4.8.6
  Anime4KMetal:
    path: ThirdParty/anime4k-metal
targets:
  AnimeCloud:
    type: application
    platform: iOS
    sources:
      - path: AnimeCloud
    dependencies:
      - package: GoogleCast
        product: GoogleCastStatic
      - package: Anime4KMetal
        product: Anime4KMetal
    settings:
      base:
        PRODUCT_MODULE_NAME: AnimeCloud
        PRODUCT_BUNDLE_IDENTIFIER: com.animecloud.reborn
        PRODUCT_NAME: AnimeCloud
        DEVELOPMENT_TEAM: WWJ39PU569
        INFOPLIST_FILE: AnimeCloud/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: AnimeCloud/Infrastructure/CryptoBridge.h
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
    postBuildScripts:
      - name: Copy Google Cast resources
        path: Scripts/copy-cast-resources.sh
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - AnimeCloudTests
  AnimeCloudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnimeCloudTests
    dependencies:
      - target: AnimeCloud
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.animecloud.reborn.tests
        GENERATE_INFOPLIST_FILE: YES
