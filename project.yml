name: AnimeCloud
options:
  bundleIdPrefix: com.animecloud
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  AnimeCloud:
    type: application
    platform: iOS
    sources:
      - path: AnimeCloud
    settings:
      base:
        PRODUCT_MODULE_NAME: AnimeCloud
        PRODUCT_BUNDLE_IDENTIFIER: com.animecloud.reborn
        PRODUCT_NAME: AnimeCloud
        INFOPLIST_FILE: AnimeCloud/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: AnimeCloud/Infrastructure/CryptoBridge.h
        OTHER_LDFLAGS:
          - "-lsqlite3"
    scheme:
      testTargets:
        - AnimeCloudTests
  AnimeCloudTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AnimeCloudTests
    dependencies:
      - target: AnimeCloud
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.animecloud.reborn.tests
